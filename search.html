<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Mashi Fashion Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="cursor"></div>
    <div id="cursor-blur"></div>

    <nav id="navbar"></nav>

    <main class="section-padding" style="min-height: 80vh;">
        <div class="container">
            <div style="max-width: 800px; margin: 0 auto; text-align: center;">
                <h1 style="font-size: 1.2rem; text-transform: uppercase; letter-spacing: 4px; color: #999; margin-bottom: 2rem;">Search our Studio</h1>
                <div style="position: relative; margin-bottom: 4rem;">
                    <input type="text" id="search-input" placeholder="Search for styles, collections..." style="width: 100%; font-size: 3rem; padding: 1.5rem 0; border: none; border-bottom: 2px solid #000; font-family: 'Outfit', sans-serif; outline: none; text-align: center;" autofocus />
                    <i data-lucide="search" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; color: #000;"></i>
                </div>

                <div id="popular-searches" style="margin-bottom: 6rem;">
                    <p style="font-size: 0.8rem; font-weight: 700; color: #999; margin-bottom: 1.5rem;">POPULAR SEARCHES</p>
                    <div class="flex" style="justify-content: center; gap: 1rem; flex-wrap: wrap;">
                        <span class="search-tag">Hoodies</span>
                        <span class="search-tag">Streetwear</span>
                        <span class="search-tag">Oversized</span>
                        <span class="search-tag">Limited Edition</span>
                        <span class="search-tag">Summer Drop</span>
                    </div>
                </div>
            </div>

            <div id="search-results-section">
                <div class="flex-between" style="margin-bottom: 3rem;">
                    <h2 id="results-count" style="font-size: 1.2rem; letter-spacing: -0.5px;">Showing 6 Results</h2>
                    <div class="flex" style="gap: 2rem; font-size: 0.8rem; font-weight: 700;">
                        <span>FILTERS</span>
                        <span>SORT BY</span>
                    </div>
                </div>

                <div id="search-results-grid" class="product-grid">
                    <!-- Dynamic Results -->
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="/src/search.js"></script>
</body>
</html>
