<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History | Mashi Fashion Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background: #F8F8F8;">
    <div id="cursor"></div>
    <div id="cursor-blur"></div>

    <div id="dashboard-layout" style="display: flex; min-height: 100vh;">
        <!-- Sidebar -->
        <aside id="dash-sidebar" style="width: 280px; background: #fff; padding: 2rem; display: flex; flex-direction: column; border-right: 1px solid var(--border-light); position: sticky; top: 0; height: 100vh;">
            <div class="logo" style="margin-bottom: 4rem;">
                <h2 style="font-size: 1.8rem; letter-spacing: -1px;">MASHI</h2>
            </div>
            <nav style="flex: 1;">
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem; padding: 0;">
                    <li class="dash-nav-item"><a href="dashboard.html" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 12px; width: 100%;"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                    <li class="dash-nav-item active"><a href="orders.html" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 12px; width: 100%;"><i data-lucide="shopping-bag"></i> Orders</a></li>
                    <li class="dash-nav-item"><a href="wishlist.html" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 12px; width: 100%;"><i data-lucide="heart"></i> Wishlist</a></li>
                    <li class="dash-nav-item"><a href="#" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 12px; width: 100%;"><i data-lucide="credit-card"></i> Mashi Points</a></li>
                    <li class="dash-nav-item"><a href="profile.html" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 12px; width: 100%;"><i data-lucide="user"></i> Profile</a></li>
                    <li class="dash-nav-item"><a href="profile.html" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 12px; width: 100%;"><i data-lucide="settings"></i> Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main style="flex: 1; padding: 3rem;">
            <header style="margin-bottom: 4rem;">
                <h1 style="font-size: 2.5rem; letter-spacing: -1px;">Order History</h1>
                <p style="color: #999; font-size: 0.9rem; margin-top: 0.5rem;">Manage and track your studio purchases.</p>
            </header>

            <div id="orders-list-container" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <!-- Orders injected here -->
            </div>
        </main>
    </div>

    <script type="module" src="/src/orders.js"></script>
</body>
</html>
